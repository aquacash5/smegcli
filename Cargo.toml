[package]
name = "smegcli"
version = "0.1.0"
edition = "2021"
authors = ["Jonathan Capps"]
description = "Fetch a random Red Dwarf frame and quote from The Smega-Drive into your terminal"
repository = "https://github.com/cappsyco/smegcli"
license = "MIT"

[dependencies]
colored = "3.1.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
viuer = { version = "0.11.0", features = ["print-file"] }
